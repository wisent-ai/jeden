[package]
name = "jeden"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jeden"
path = "rust/main.rs"

[dependencies]
base64 = "0.22"
aes-gcm = "0.10"
hex = "0.4"
flate2 = "1"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
glob = "0.3"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
