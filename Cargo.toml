[package]
name = "jeden"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jeden"
path = "rust/main.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
