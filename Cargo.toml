[package]
name = "jeden"
version = "0.2.0"
edition = "2021"
license-file = "LICENSE"
# No test target is built until the operator approves one with
# `tama tests approve`.
autotests = false
[lib]
path = "rust/lib.rs"


[[bin]]
name = "jeden"
path = "rust/main.rs"

[[bin]]
name = "jeden-quality-report"
path = "rust/report/main.rs"

[[bin]]
name = "jeden-reference-benchmark"
path = "rust/bin/jeden-reference-benchmark.rs"

[[bin]]
name = "jeden-sandbox-helper"
path = "rust/bin/jeden-sandbox-helper.rs"

[[test]]
name = "tracking-api"
path = "tests/tracking/api.rs"

[[test]]
name = "network-egress"
path = "tests/network/egress.rs"


[dependencies]
# By git rev, not by sibling path: a path dependency outside this repository
# resolves only on a machine that happens to hold both checkouts, and nowhere in
# CI. `image-video-router` consumes the same crate this way.
wisent-onboarding-client = { git = "https://github.com/wisent-ai/echo-web", rev = "17f8a8a52add00b41f515d98682e5f33f86f71b1", package = "wisent-onboarding-client" }
pursuit = { git = "https://github.com/wisent-ai/pursuit", rev = "8955ef3db3a91a22cefa73bbd4f9fb36ec6f3e44" }
agent-client-protocol = { version = "=1.2.0", features = ["unstable_elicitation"] }
base64 = "0.22"
arc-swap = { version = "1", features = ["serde"] }
aes-gcm = "0.10"
crossterm = { version = "0.28", features = ["event-stream"] }
# Theme colors written as CSS colors (`#rrggbb`, names) in theme.json.
csscolorparser = "0.6"
# Delimited tables (CSV, TSV) read by read_document as a spreadsheet reads them.
csv = "1"
ctrlc = { version = "3.5.2", features = ["termination"] }
hex = "0.4"
# RSS, Atom and JSON Feed documents read by their structure in read_document.
feed-rs = "2"
flate2 = "1"
futures = "0.3"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
# The URI schemes a network grant admits, as the HTTP stack declares them.
http = "1"
glob = "0.3"
regex = "1"
parking_lot = "0.12"
qrcode = { version = "0.14", default-features = false }
rustls = "0.23"
rustls-pemfile = "2"
x509-parser = "0.18"
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
stado-database = { git = "https://github.com/wisent-ai/stado", package = "stado-database" }
stado-wait = { git = "https://github.com/wisent-ai/stado", package = "stado-wait" }
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
# The collaboration relay's HTTP server: requests are read and answered by it.
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-stream = "0.1"
tokio-rustls = "0.26"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
shell-words = "1"
url = "2"
# Weles path segments encoded to the URI standard's unreserved set.
percent-encoding = "2"
unicode-segmentation = "1.12"
uuid = { version = "1", features = ["v4", "serde"] }
unicode-width = "0.2"
# Instants and spans: reading a stated instant and how long ago it was.
jiff = "0.2"

tree-sitter = "0.25"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
ignore = "0.4"

[target."cfg(unix)".dependencies]
libc = "0.2"

[build-dependencies]
# The build script's git calls say on stderr what they wait for, like every other wait.
stado-wait = { git = "https://github.com/wisent-ai/stado", package = "stado-wait", default-features = false }

# Shapes a defect was once filed against, refused where they would come back.
# `match` on a bool hid an `if` from a gate that read `== 0` as a number; the
# disallowed methods are listed with their reasons in clippy.toml. `let _ =`
# over a Result dropped failed kills, removals, syncs and writes without a
# word, so a discarded must-use value is refused where it is written: the
# caller says the failure or states, in code, why none is owed.
[lints.clippy]
match_bool = "deny"
disallowed_methods = "deny"
let_underscore_must_use = "deny"
