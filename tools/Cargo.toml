[package]
name = "jeden-tools"
version = "0.1.0"
edition = "2021"
publish = false
description = "Jeden's repository tooling: the release build wrapper, the public surface and its published baseline, the protocol compatibility gate and the versioning rule."
license-file = "../LICENSE"

# Its own workspace: the release wrapper has to build before the private Git
# sources the jeden package names are configured, so it cannot share jeden's
# lockfile or resolution.
[workspace]

[[bin]]
name = "jeden-tools"
path = "src/main.rs"

[dependencies]
# The fleet's one versioning rule, the rule alone (no surface parser).
autoversion = { git = "https://github.com/lbartoszcze/AutoVersion.git", rev = "f7dde3c1461a292d72d8f956fc815f01a4ee4dca", default-features = false }
base64 = "0.22"
regex = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
