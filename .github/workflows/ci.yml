name: build-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTFLAGS: '-D warnings'

jobs:

  rust-gates:
    uses: wisent-ai/quality-control/.github/workflows/rust-gates.yml@90a668cc614a43e95289b4233e420f14a546353c
    secrets:
      repository_token: ${{ secrets.WISENT_PACKAGES_TOKEN }}

  # The VS Code client refuses a field an agent's message lacks instead of
  # filling it in; its lint refuses a new stand-in where it is written.
  vscode:
    name: VS Code client
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/vscode-jeden
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The current Node.js long-term-support release, as setup-node resolves `lts/*`.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint

  # jeden-tools is its own Cargo workspace (it has to build before the
  # private Git sources are configured), so rust-gates does not see it.
  tools:
    name: Repository tools
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Protocol compatibility gate
        run: cargo run --quiet --locked --manifest-path tools/Cargo.toml -- protocol-check
      - name: Public surface
        run: cargo run --quiet --locked --manifest-path tools/Cargo.toml -- surface

  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-gates, tools, vscode]
    permissions:
      contents: write
    uses: wisent-ai/quality-control/.github/workflows/tag-on-manifest-bump.yml@897485548846d7dfe38832b6b9a38212cdd1685a
    with:
      manifest: Cargo.toml
