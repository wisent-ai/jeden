name: Canonical signed quality report

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Completed or cancelled producer run containing signed quality-evidence-* artifacts
        required: true
        type: string
      revision:
        description: Exact source revision bound by every evidence payload
        required: true
        type: string
      environment:
        description: Exact environment bound by every evidence payload
        required: true
        type: string
      generated_at_epoch_seconds:
        description: Deterministic report timestamp (Unix epoch seconds)
        required: true
        type: string
      maximum_evidence_age_seconds:
        description: Maximum accepted evidence age
        required: true
        default: "604800"
        type: string

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}

      - name: Download signed evidence from the selected run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.evidence_run_id }}
          pattern: quality-evidence-*
          path: quality-evidence
          merge-multiple: true

      - name: Materialize approved public roots
        env:
          EVIDENCE_ROOT_JSON: ${{ vars.JEDEN_QUALITY_EVIDENCE_ROOT_JSON }}
          REPORT_ROOT_JSON: ${{ vars.JEDEN_QUALITY_REPORT_ROOT_JSON }}
        run: |
          test -n "$EVIDENCE_ROOT_JSON" || { echo 'ExternalBlocked: JEDEN_QUALITY_EVIDENCE_ROOT_JSON approved public root' >&2; exit 2; }
          test -n "$REPORT_ROOT_JSON" || { echo 'ExternalBlocked: JEDEN_QUALITY_REPORT_ROOT_JSON approved public root' >&2; exit 2; }
          printf '%s' "$EVIDENCE_ROOT_JSON" > evidence-root.json
          printf '%s' "$REPORT_ROOT_JSON" > report-root.json

      - name: Run focused report acceptance tests
        run: cargo test --lib report::tests -- --nocapture

      - name: Aggregate canonical evidence and generate human report
        env:
          REPORT_SIGNING_SEED: ${{ secrets.JEDEN_QUALITY_REPORT_SIGNING_SEED_HEX }}
        run: |
          test -n "$REPORT_SIGNING_SEED" || { echo 'ExternalBlocked: JEDEN_QUALITY_REPORT_SIGNING_SEED_HEX signing identity' >&2; exit 2; }
          echo "::add-mask::$REPORT_SIGNING_SEED"
          mkdir -p docs/reports
          cargo run --quiet --bin jeden-quality-report -- build quality-evidence evidence-root.json "$REPORT_SIGNING_SEED" '${{ inputs.revision }}' '${{ inputs.environment }}' '${{ inputs.generated_at_epoch_seconds }}' '${{ inputs.maximum_evidence_age_seconds }}' quality-report.json docs/reports/quality-report.md

      - name: Verify approved report root and privacy boundary
        run: |
          cargo run --quiet --bin jeden-quality-report -- verify quality-report.json report-root.json
          cargo run --quiet --bin jeden-quality-report -- privacy-scan quality-report.json docs/reports/quality-report.md

      - name: Upload immutable machine report and generated human view
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            quality-report.json
            docs/reports/quality-report.md
          if-no-files-found: error
          retention-days: 90
