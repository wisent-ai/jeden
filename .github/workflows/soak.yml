name: reliability-soak

on:
  pull_request:
    paths:
      - 'rust/runtime_ops/**'
      - 'rust/telemetry/**'
      - 'rust/test_support/**'
      - 'tests/soak/**'
      - 'tests/fault/**'
      - '.github/workflows/soak.yml'
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Reliability profile
        type: choice
        options: [pr, nightly]
        default: pr

permissions:
  contents: read

jobs:
  deterministic-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile fault matrix
        run: rustc --edition=2021 --test tests/fault/crash_matrix.rs -o /tmp/jeden-fault-matrix
      - name: Run fault matrix
        run: /tmp/jeden-fault-matrix
      - name: Compile soak harness
        run: rustc --edition=2021 --test tests/soak/reliability.rs -o /tmp/jeden-soak
      - name: Run fixed-seed PR stress
        env:
          JEDEN_SOAK_OPERATIONS: '1000'
          JEDEN_SOAK_REAL_SECONDS: '0'
        run: /tmp/jeden-soak

  nightly-soak:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - name: Compile soak harness
        run: rustc --edition=2021 --test tests/soak/reliability.rs -o /tmp/jeden-soak
      - name: Run 24-hour and 10000-operation soak
        env:
          JEDEN_SOAK_OPERATIONS: '10000'
          JEDEN_SOAK_REAL_SECONDS: '86400'
        run: /tmp/jeden-soak
