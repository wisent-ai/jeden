name: Version check

# Refuse a change whose declared version disagrees with what it did to the public
# contract. Jeden's contract is its command vocabulary — the `jeden <command>`
# subcommands scripts and the ACP/VS Code clients invoke, and the `/command` names
# an interactive user types — so adding one is a capability and removing one
# breaks whoever scripted it yesterday.
#
# The rule is the fleet's shared one, https://github.com/lbartoszcze/AutoVersion,
# whose SPEC keeps one small implementation per consumer language, held identical
# by its conformance fixtures. Jeden's is the Rust port in tools/src/versioning,
# run as `jeden-tools versioning decide`; tests/versioning/ reproduces every
# fixture of AutoVersion v0.1.0 against it. This workflow supplies only the three
# things this repository alone knows: its surface, the version it declares, and
# the published artifact its baseline was recovered from.
#
# Cargo.toml holds the SemVer *floor*, and the canary pipeline publishes
# floor-plus-one-patch as a prerelease. So the version compared here is the
# floor, which is also what the published artifact's signed manifest records as
# `minimumVersion`: the rule refuses anything that is not a major.minor.patch
# triple, and the floor is the only stable triple the published evidence names.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autoversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the repository tools
        run: |
          set -euo pipefail
          cargo build --quiet --locked --manifest-path tools/Cargo.toml
          echo "TOOL=$PWD/tools/target/debug/jeden-tools" >> "$GITHUB_ENV"

      - name: Read candidate public surface
        run: |
          set -euo pipefail
          "$TOOL" surface > "$RUNNER_TEMP/candidate-surface.json"
          jq -e '.surface | arrays | length > 0' "$RUNNER_TEMP/candidate-surface.json" >/dev/null

      - name: Enforce released surface and committed manifest version
        env:
          MANIFEST: Cargo.toml
          BASELINE: released-surface.json
        run: |
          set -euo pipefail
          git diff --quiet -- "$MANIFEST" || {
            echo "::error::$MANIFEST was modified while deriving the candidate; the gate only accepts the committed version."
            false
          }
          declared="$("$TOOL" versioning manifest-version "$MANIFEST")"
          # The floor, because that is the scale `declared` is on. A baseline that
          # names no floor falls back to its version, which is what every other
          # repository in the pack publishes.
          released="$(jq -er '(.minimumVersion // .version) | strings | select(length > 0)' "$BASELINE")"
          printf '%s' "$released" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::$BASELINE names '$released' as the comparable version, which is not a major.minor.patch triple."
            false
          }
          jq -e '.surface | arrays | length > 0' "$BASELINE" >/dev/null

          jq '{surface: .surface}' "$BASELINE" > "$RUNNER_TEMP/identical.json"
          jq '{surface: (.surface - [(.surface | sort | first)])}' "$BASELINE" > "$RUNNER_TEMP/removed.json"
          unchanged="$("$TOOL" versioning decide --current "$released" \
            --published-surface "$BASELINE" --candidate-surface "$RUNNER_TEMP/identical.json" \
            --json | jq -er .change)"
          removed="$("$TOOL" versioning decide --current "$released" \
            --published-surface "$BASELINE" --candidate-surface "$RUNNER_TEMP/removed.json" \
            --json | jq -er .change)"
          if [ "$unchanged" != internal ] || [ "$removed" != breaking ]; then
            echo "::error::Versioning rule self-check returned identical=$unchanged removed=$removed."
            false
          fi

          verdict="$("$TOOL" versioning decide --current "$released" \
            --published-surface "$BASELINE" \
            --candidate-surface "$RUNNER_TEMP/candidate-surface.json" --json)"
          echo "$verdict"
          change="$(printf '%s' "$verdict" | jq -er .change)"
          required="$(printf '%s' "$verdict" | jq -er .next)"
          if [ "$declared" = "$released" ]; then
            if [ "$change" != internal ]; then
              echo "::error::$MANIFEST commits $declared, but the public surface is $change and requires $required."
              false
            fi
          elif [ "$declared" != "$required" ]; then
            echo "::error::$MANIFEST commits $declared, but the $change change from $released requires $required."
            false
          fi
          echo "Committed manifest version $declared satisfies the $change public-surface change from $released."

  baseline-provenance:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Refuse a baseline that misstates where it came from
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cargo build --quiet --locked --manifest-path tools/Cargo.toml
          tool="$PWD/tools/target/debug/jeden-tools"
          # released-surface.json must describe an artifact a user can actually
          # obtain. The marker is the first whitespace-delimited token of "source"
          # and is written by `jeden-tools versioning baseline`, so the two agree by
          # a constant rather than by prose.
          marker="$(jq -r '.source | split(" ") | first' released-surface.json)"
          baseline="$(jq -r .version released-surface.json)"
          tier="${marker%%:*}"

          case "$tier" in
            gh-release)
              tag="${marker#gh-release:}"
              # Forward assertion: this repository publishes to GitHub Releases, so
              # the named release must really serve the named version. Asserting
              # against crates.io instead would be worse than useless -- the `jeden`
              # name there is an unrelated third party's `cargo new` stub, so both
              # directions would be false.
              served="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                | jq -r --arg version "$baseline" \
                    'any(.assets[].name; startswith("jeden-" + $version + "-"))')"
              if [ "$served" != "true" ]; then
                echo "::error::released-surface.json names $baseline, but release $tag" \
                  "serves no jeden-$baseline-<target>.tar.gz. The baseline was" \
                  "hand-edited and every later comparison is measured against" \
                  "something nobody can install. Run jeden-tools versioning baseline."
                false
              fi
              echo "Baseline $baseline is served by $tag."
              ;;
            *)
              # The generator only ever emits gh-release:, and refuses if this
              # repository publishes nothing. Any other tier means the file was
              # hand-edited or the release channel disappeared; either way a human
              # decides, rather than this gate quietly accepting a weaker baseline.
              echo "::error::unknown baseline marker: $marker"
              false
              ;;
          esac

          # Being honest about the tier is not the same as being on the best one.
          # A newer release supersedes this baseline without making its marker a
          # lie, and the gate would go on measuring a superseded artifact. Only the
          # marker is regenerated here: the committed surface stays the only
          # surface any decision sees, because recomputing both sides at check time
          # is the one shape that structurally cannot refuse.
          #
          # `--marker` resolves the newest release over HTTP without reproducing a
          # source revision, which is why this job needs no tag fetch after a
          # shallow, tagless checkout. The moment a step here runs the generator
          # without `--marker`, resolves a tag, or archives one, a step that
          # force-fetches the tags and unshallows becomes mandatory.
          best="$("$tool" versioning baseline --marker)"
          if [ "$best" != "$marker" ]; then
            echo "::error::the baseline was recovered from $marker, but $best is" \
              "published now. Run jeden-tools versioning baseline."
            false
          fi
          echo "Tier '$tier' at $tag is still the newest published artifact."
