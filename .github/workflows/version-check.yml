name: Version check

# Refuse a change whose declared version disagrees with what it did to the public
# contract. Jeden's contract is its command vocabulary — the `jeden <command>`
# subcommands scripts and the ACP/VS Code clients invoke, and the `/command` names
# an interactive user types — so adding one is a capability and removing one
# breaks whoever scripted it yesterday.
#
# The rule itself lives in one place for the whole fleet and is not copied here:
# https://github.com/lbartoszcze/AutoVersion. This workflow supplies only the
# three things this repository alone knows: its surface, the version it declares,
# and the published artifact its baseline was recovered from.
#
# Note on this repository's version scheme: Cargo.toml holds the SemVer *floor*,
# and the canary pipeline publishes floor-plus-one-patch as a prerelease. So the
# version compared here is the floor, which is also what the published artifact's
# signed manifest records as `minimumVersion`. The shared rule refuses anything
# that is not a major.minor.patch triple, and the floor is the only stable triple
# the published evidence names.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the shared rule
        # Never `pip install` into the system interpreter. `ubuntu-latest` resolves to an
        # Ubuntu whose python3 carries the externally-managed marker, so that spelling
        # dies with `error: externally-managed-environment` before any check runs -- a
        # permanently red gate, which by this fleet's own standard is worth exactly what a
        # sleeping one is worth and trains people to ignore a red build. Invisible from a
        # laptop, and invisible here too while Actions is billing-locked, because this step
        # has never once run on a runner.
        #
        # A venv sidesteps the marker without --break-system-packages, and appending its
        # bin to GITHUB_PATH leaves every later `autoversion` call spelled exactly as it
        # was. RUNNER_TEMP and GITHUB_PATH exist only on a runner, hence the defaults --
        # which are also what let this body be extracted and run locally, the only
        # technique available here that can falsify a claim about CI.
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:=$(mktemp -d)}"
          : "${GITHUB_PATH:=$(mktemp)}"
          python3 -m venv "$RUNNER_TEMP/rule"
          "$RUNNER_TEMP/rule/bin/python" -m pip install --quiet \
            "git+https://github.com/lbartoszcze/AutoVersion@v0.1.0"
          echo "$RUNNER_TEMP/rule/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH takes effect on the NEXT step only, so without this export the
          # assertion below would consult whatever `autoversion` was already on PATH --
          # including a stranger's, which would exit zero and vouch for a rule nobody
          # asked. Prepending after the install is what makes the venv win, and it is
          # load-bearing separately from the GITHUB_PATH line.
          export PATH="$RUNNER_TEMP/rule/bin:$PATH"

          # Which `autoversion` is about to answer? Establish that BEFORE asking it
          # anything. `--help` is satisfied by any executable that exits zero, so a
          # stranger earlier on PATH passes a liveness probe and then supplies every
          # verdict below -- and if the export above is ever dropped in an edit, the
          # symptom is a green step rather than a red one. Naming the resolved path is
          # what makes that failure visible instead of invisible.
          resolved="$(command -v autoversion || true)"
          case "$resolved" in
            "$RUNNER_TEMP/rule/bin/"*) ;;
            *)
              echo "::error::autoversion resolves to '${resolved:-nothing}', outside the" \
                "venv this step just built, so a stranger would answer for the rule and" \
                "every verdict below would be its word rather than the rule's."
              false
              ;;
          esac

          # Then two DIFFERENT known answers, because one cannot be enough: a saboteur
          # that always says `internal` passes a single-answer probe AND the gate's own
          # steps, since while the declared floor equals the published one `internal` IS
          # the passing branch. Identical surfaces must read `internal`; a surface with
          # one name removed must read `breaking`. That second arm is the only thing here
          # that requires the gate to be ABLE TO REFUSE.
          #
          # Both sides are built from the COMMITTED baseline rather than a synthetic
          # pair, so this same step also proves the frozen file parses and that it is
          # the file reaching the decision. The name is dropped without a bare index,
          # which this workspace refuses. An empty candidate would be no use as the
          # breaking case -- the rule rejects it outright as a far more likely broken
          # extractor.
          shrunk="$RUNNER_TEMP/shrunk.json"
          jq '{surface: (.surface - [(.surface | sort | first)])}' \
            released-surface.json > "$shrunk"
          current="$(jq -r .minimumVersion released-surface.json)"
          unchanged="$(autoversion decide --current "$current" \
            --published-surface released-surface.json \
            --candidate-surface released-surface.json --json | jq -r .change)"
          removed="$(autoversion decide --current "$current" \
            --published-surface released-surface.json \
            --candidate-surface "$shrunk" --json | jq -r .change)"
          if [ "$unchanged" != internal ] || [ "$removed" != breaking ]; then
            echo "::error::the rule does not answer as the rule: the committed surface" \
              "against itself read '$unchanged', and with one name removed it read" \
              "'$removed'. Something other than AutoVersion is answering, so no verdict" \
              "below means anything."
            false
          fi

      - name: Read the public surface
        # No build: the surface is read out of rust/main.rs and rust/capability/mod.rs
        # statically, so this cannot be broken by a Rust toolchain or a crate index
        # being unavailable, and it stays cheap. A file that does not parse, or a
        # declaration site that has moved, fails the step rather than silently
        # shrinking the surface — a half-read surface would look like a clean
        # removal and mislabel the release.
        run: python3 scripts/surface.py > "$RUNNER_TEMP/candidate.json"

      - name: Compare against the released contract
        run: |
          set -euo pipefail
          baseline="$(jq -r .version released-surface.json)"
          floor="$(jq -r .minimumVersion released-surface.json)"
          declared="$(awk -F'"' '/^version *=/{print $2; exit}' Cargo.toml)"
          echo "published: $baseline (floor $floor)"
          echo "declared:  $declared"

          verdict="$(autoversion decide \
            --current "$floor" \
            --published-surface released-surface.json \
            --candidate-surface "$RUNNER_TEMP/candidate.json" \
            --json)"
          echo "$verdict"

          change="$(printf '%s' "$verdict" | jq -r .change)"
          required="$(printf '%s' "$verdict" | jq -r .next)"

          if [ "$declared" = "$floor" ]; then
            # The floor has not moved since the published artifact was built, so
            # the next publication would reuse the version that artifact already
            # carries. That is only honest if the contract is unchanged.
            if [ "$change" != "internal" ]; then
              echo "::error::The public contract changed ($change) but Cargo.toml still" \
                "declares the floor $floor that published artifact $baseline was built" \
                "from, so the next canary would republish that version with a different" \
                "surface. The floor must be raised to $required."
              false
            fi
            echo "Floor unmoved since $baseline and the contract is unchanged."
          elif [ "$declared" != "$required" ]; then
            echo "::error::Cargo.toml declares $declared, but a $change change to" \
              "$floor requires $required."
            false
          else
            echo "Declared floor matches the $change change."
          fi

      - name: Refuse a baseline that misstates where it came from
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # released-surface.json must describe an artifact a user can actually
          # obtain. The marker is the first whitespace-delimited token of "source"
          # and is written by scripts/baseline.py, so the two files agree by a
          # constant rather than by prose.
          marker="$(jq -r '.source | split(" ") | first' released-surface.json)"
          baseline="$(jq -r .version released-surface.json)"
          tier="${marker%%:*}"

          case "$tier" in
            gh-release)
              tag="${marker#gh-release:}"
              # Forward assertion: this repository publishes to GitHub Releases, so
              # the named release must really serve the named version. Asserting
              # against crates.io instead would be worse than useless -- the `jeden`
              # name there is an unrelated third party's `cargo new` stub, so both
              # directions would be false.
              served="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                | jq -r --arg version "$baseline" \
                    'any(.assets[].name; startswith("jeden-" + $version + "-"))')"
              if [ "$served" != "true" ]; then
                echo "::error::released-surface.json names $baseline, but release $tag" \
                  "serves no jeden-$baseline-<target>.tar.gz. The baseline was" \
                  "hand-edited and every later comparison is measured against" \
                  "something nobody can install. Run scripts/baseline.py."
                false
              fi
              echo "Baseline $baseline is served by $tag."
              ;;
            *)
              # scripts/baseline.py only ever emits gh-release:, and raises if this
              # repository publishes nothing. Any other tier means the file was
              # hand-edited or the release channel disappeared; either way a human
              # decides, rather than this gate quietly accepting a weaker baseline.
              echo "::error::unknown baseline marker: $marker"
              false
              ;;
          esac

          # Being honest about the tier is not the same as being on the best one.
          # A newer release supersedes this baseline without making its marker a
          # lie, and the gate would go on measuring a superseded artifact. Only the
          # marker is regenerated here: the committed surface stays the only
          # surface any decision sees, because recomputing both sides at check time
          # is the one shape that structurally cannot refuse.
          #
          # `--marker` and no other flag, and that is why this workflow needs no tag
          # fetch after checkout. `actions/checkout@v4` takes one commit and no tags, so
          # any step that resolved a tag or ran `git archive` would be blind here -- but
          # every fact this job consults arrives over HTTP or from a static read of the
          # checked-out tree: the floor from `awk` on Cargo.toml, the surface from
          # scripts/surface.py, the tier from the releases API. `--marker` exists
          # precisely so the generator answers without reproducing a source revision a
          # shallow checkout does not have. Measured: this whole job runs green inside
          # `git clone --depth=one --no-tags`, which is the shape a runner checks out.
          #
          # What revokes that, so nobody has to remember it: the moment a step here
          # invokes this generator WITHOUT `--marker`, resolves a tag, or archives one,
          # a step that force-fetches the tags AND unshallows becomes mandatory, because
          # a shallow clone lacks both the tag and its tree. Copy the "Make tags and
          # history visible" step from wisent-desktop-auth's gate; it is not spelled out
          # here on purpose, so that the fleet audit -- which decides this workflow needs
          # such a step by looking for that command as a substring -- cannot be talked
          # out of flagging a future defect by a comment that merely quotes the cure.
          best="$(python3 scripts/baseline.py --marker)"
          if [ "$best" != "$marker" ]; then
            echo "::error::the baseline was recovered from $marker, but $best is" \
              "published now. Run scripts/baseline.py."
            false
          fi
          echo "Tier '$tier' at $tag is still the newest published artifact."
