name: Canary build evidence

on:
  workflow_run:
    workflows: ['build-ci']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: canary-build-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:

  build-evidence:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Build unsigned evidence (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            executable: jeden
          - target: aarch64-apple-darwin
            runner: macos-14
            executable: jeden
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            executable: jeden.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      TARGET_TRIPLE: ${{ matrix.target }}
      CONTRACTUAL_CI_RUN_ID: ${{ github.event.workflow_run.id }}
      CONTRACTUAL_CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - name: Check out the exact contractual CI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure private Git dependency access
        shell: bash
        env:
          REPOSITORY_TOKEN: ${{ secrets.WISENT_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$REPOSITORY_TOKEN" ]; then
            echo "::error::WISENT_PACKAGES_TOKEN is not set, so cargo cannot read the private wisent-ai dependencies this crate names (pursuit, echo-web). Set it to a token with read access to both."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${REPOSITORY_TOKEN}@github.com/".insteadOf \
            https://github.com/
          printf '%s\n' 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"

      - name: Install Rust toolchain for target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build the repository tools
        shell: bash
        run: |
          set -euo pipefail
          cargo build --quiet --locked --manifest-path tools/Cargo.toml
          echo "TOOL=$PWD/tools/target/debug/jeden-tools" >> "$GITHUB_ENV"

      - name: Resolve automatic canary version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$("$TOOL" versioning manifest-version Cargo.toml)"
          if [[ ! "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo '::error::Cargo package version must be a stable SemVer for automatic canary versioning'
            exit 1
          fi
          next_patch=$((10#${BASH_REMATCH[3]} + 1))
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${next_patch}-canary.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.sha${SOURCE_SHA:0:12}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build target exactly once
        shell: bash
        env:
          JEDEN_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --locked --release --target '${{ matrix.target }}' --bin jeden

      - name: Package immutable executable bytes
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sbom-input
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" 'dist/${{ matrix.executable }}'
          cp 'dist/${{ matrix.executable }}' 'dist/sbom-input/${{ matrix.executable }}'
          archive="jeden-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -C dist -czf "dist/$archive" '${{ matrix.executable }}'
          "$TOOL" release facts "dist/$archive" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          path: dist/sbom-input
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false

      - name: Bind SBOM to immutable build artifact
        env:
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          jq -cS --arg digest "$ARTIFACT_SHA256" \
            '.documentComment = "Jeden immutable build artifact sha256:" + $digest' \
            dist/sbom.spdx.json > dist/sbom.bound.json
          mv dist/sbom.bound.json dist/sbom.spdx.json

      - name: Generate provenance statement
        env:
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          ARTIFACT_SIZE: ${{ steps.artifact.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          jq -ncS \
            --arg name "$ARTIFACT_NAME" \
            --arg digest "$ARTIFACT_SHA256" \
            --arg target "$TARGET_TRIPLE" \
            --arg source "git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@$SOURCE_SHA" \
            --arg builder "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg invocation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            '{
              _type: "https://in-toto.io/Statement/v1",
              subject: [{name: $name, digest: {sha256: $digest}}],
              predicateType: "https://slsa.dev/provenance/v1",
              predicate: {
                buildDefinition: {
                  buildType: "https://github.com/jeden/release/.github/workflows/release.yml@v3",
                  externalParameters: {targetTriple: $target},
                  internalParameters: {lockedDependencies: true},
                  resolvedDependencies: [{uri: $source}]
                },
                runDetails: {
                  builder: {id: $builder},
                  metadata: {invocationId: $invocation}
                }
              }
            }' > dist/provenance.intoto.json

      - name: Create publisher build handoff
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          MINIMUM_VERSION: '0.1.0'
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          ARTIFACT_SIZE: ${{ steps.artifact.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          sbom_sha256="$("$TOOL" release facts dist/sbom.spdx.json | sed -n 's/^sha256=//p')"
          provenance_sha256="$("$TOOL" release facts dist/provenance.intoto.json | sed -n 's/^sha256=//p')"
          jq -ncS \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$SOURCE_SHA" \
            --arg version "$BUILD_VERSION" \
            --arg minimum "$MINIMUM_VERSION" \
            --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg ci_run "$CONTRACTUAL_CI_RUN_ID" \
            --argjson ci_attempt "$CONTRACTUAL_CI_RUN_ATTEMPT" \
            --arg build_run "$GITHUB_RUN_ID" \
            --argjson build_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg target "$TARGET_TRIPLE" \
            --arg name "$ARTIFACT_NAME" \
            --arg digest "$ARTIFACT_SHA256" \
            --argjson size "$ARTIFACT_SIZE" \
            --arg sbom "$sbom_sha256" \
            --arg provenance "$provenance_sha256" \
            '{
              schema: "jeden.release-build-handoff/v1",
              repository: $repository,
              headSha: $head,
              version: $version,
              minimumVersion: $minimum,
              createdAt: $created,
              contractualCiRunId: $ci_run,
              contractualCiRunAttempt: $ci_attempt,
              buildRunId: $build_run,
              buildRunAttempt: $build_attempt,
              targetTriple: $target,
              artifact: {name: $name, sha256: $digest, size: $size},
              sbom: {name: "sbom.spdx.json", sha256: $sbom},
              provenance: {name: "provenance.intoto.json", sha256: $provenance}
            }' > dist/build-handoff.json

      - name: Upload unsigned build evidence for the publisher
        uses: actions/upload-artifact@v4
        with:
          name: canary-build-${{ matrix.target }}-${{ github.event.workflow_run.head_sha }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            dist/${{ steps.artifact.outputs.name }}
            dist/build-handoff.json
            dist/sbom.spdx.json
            dist/provenance.intoto.json
