name: Canary build evidence

on:
  workflow_run:
    workflows: ['contractual-ci']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: canary-build-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  build-evidence:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Build unsigned evidence (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            executable: jeden
          - target: aarch64-apple-darwin
            runner: macos-14
            executable: jeden
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            executable: jeden.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      TARGET_TRIPLE: ${{ matrix.target }}
      CONTRACTUAL_CI_RUN_ID: ${{ github.event.workflow_run.id }}
      CONTRACTUAL_CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      - name: Check out the exact contractual CI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Resolve automatic canary version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ ! "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo '::error::Cargo package version must be a stable SemVer for automatic canary versioning'
            exit 1
          fi
          next_patch=$((10#${BASH_REMATCH[3]} + 1))
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${next_patch}-canary.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.sha${SOURCE_SHA:0:12}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain for target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build target exactly once
        shell: bash
        run: cargo build --locked --release --target '${{ matrix.target }}' --bin jeden

      - name: Package immutable executable bytes
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sbom-input
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" 'dist/${{ matrix.executable }}'
          cp 'dist/${{ matrix.executable }}' 'dist/sbom-input/${{ matrix.executable }}'
          archive="jeden-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar -C dist -czf "dist/$archive" '${{ matrix.executable }}'
          python3 - "$archive" <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, pathlib, sys
          name = sys.argv[1]
          path = pathlib.Path('dist') / name
          print(f'name={name}')
          print(f'sha256={hashlib.sha256(path.read_bytes()).hexdigest()}')
          print(f'size={path.stat().st_size}')
          PY

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          path: dist/sbom-input
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false

      - name: Bind SBOM to immutable build artifact
        env:
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, pathlib
          path = pathlib.Path('dist/sbom.spdx.json')
          document = json.loads(path.read_text(encoding='utf-8'))
          document['documentComment'] = f'Jeden immutable build artifact sha256:{os.environ["ARTIFACT_SHA256"]}'
          path.write_text(json.dumps(document, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

      - name: Generate provenance statement
        env:
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          ARTIFACT_SIZE: ${{ steps.artifact.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, pathlib
          statement = {
            '_type': 'https://in-toto.io/Statement/v1',
            'subject': [{'name': os.environ['ARTIFACT_NAME'], 'digest': {'sha256': os.environ['ARTIFACT_SHA256']}}],
            'predicateType': 'https://slsa.dev/provenance/v1',
            'predicate': {
              'buildDefinition': {
                'buildType': 'https://github.com/jeden/release/.github/workflows/release.yml@v3',
                'externalParameters': {'targetTriple': os.environ['TARGET_TRIPLE']},
                'internalParameters': {'lockedDependencies': True},
                'resolvedDependencies': [{'uri': f'git+{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}@{os.environ["SOURCE_SHA"]}'}],
              },
              'runDetails': {
                'builder': {'id': f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'},
                'metadata': {'invocationId': f'{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}'},
              },
            },
          }
          pathlib.Path('dist/provenance.intoto.json').write_text(
              json.dumps(statement, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8'
          )
          PY

      - name: Create publisher build handoff
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          MINIMUM_VERSION: '0.1.0'
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          ARTIFACT_SIZE: ${{ steps.artifact.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime, hashlib, json, os, pathlib
          dist = pathlib.Path('dist')
          handoff = {
            'schema': 'jeden.release-build-handoff/v1',
            'repository': os.environ['GITHUB_REPOSITORY'],
            'headSha': os.environ['SOURCE_SHA'],
            'version': os.environ['BUILD_VERSION'],
            'minimumVersion': os.environ['MINIMUM_VERSION'],
            'createdAt': datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
            'contractualCiRunId': os.environ['CONTRACTUAL_CI_RUN_ID'],
            'contractualCiRunAttempt': int(os.environ['CONTRACTUAL_CI_RUN_ATTEMPT']),
            'buildRunId': os.environ['GITHUB_RUN_ID'],
            'buildRunAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
            'targetTriple': os.environ['TARGET_TRIPLE'],
            'artifact': {
              'name': os.environ['ARTIFACT_NAME'],
              'sha256': os.environ['ARTIFACT_SHA256'],
              'size': int(os.environ['ARTIFACT_SIZE']),
            },
            'sbom': {
              'name': 'sbom.spdx.json',
              'sha256': hashlib.sha256((dist / 'sbom.spdx.json').read_bytes()).hexdigest(),
            },
            'provenance': {
              'name': 'provenance.intoto.json',
              'sha256': hashlib.sha256((dist / 'provenance.intoto.json').read_bytes()).hexdigest(),
            },
          }
          (dist / 'build-handoff.json').write_text(
              json.dumps(handoff, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload unsigned build evidence for the publisher
        uses: actions/upload-artifact@v4
        with:
          name: canary-build-${{ matrix.target }}-${{ github.event.workflow_run.head_sha }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            dist/${{ steps.artifact.outputs.name }}
            dist/build-handoff.json
            dist/sbom.spdx.json
            dist/provenance.intoto.json
