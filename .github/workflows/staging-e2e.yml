name: Staging Brama Weles E2E

on:
  workflow_dispatch:
    inputs:
      release_digest:
        description: Immutable canary release digest
        required: true
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  BRAMA_STAGING_URL: ${{ vars.BRAMA_STAGING_URL }}
  WELES_STAGING_URL: ${{ vars.WELES_STAGING_URL }}
  JEDEN_STAGING_OIDC_AUDIENCE: ${{ vars.JEDEN_STAGING_OIDC_AUDIENCE }}
  JEDEN_STAGING_OIDC_ROLE: ${{ vars.JEDEN_STAGING_OIDC_ROLE }}
  JEDEN_STAGING_TENANT: ${{ vars.JEDEN_STAGING_TENANT }}
  JEDEN_STAGING_PROVIDER: ${{ vars.JEDEN_STAGING_PROVIDER }}
  JEDEN_STAGING_MODEL: ${{ vars.JEDEN_STAGING_MODEL }}
  JEDEN_STAGING_SCHEMA_MIN: ${{ vars.JEDEN_STAGING_SCHEMA_MIN }}
  JEDEN_STAGING_SCHEMA_MAX: ${{ vars.JEDEN_STAGING_SCHEMA_MAX }}
  JEDEN_RELEASE_DIGEST: ${{ inputs.release_digest || vars.JEDEN_CANARY_RELEASE_DIGEST }}
  JEDEN_CONTROL_PLANE_REPORT: control-plane-e2e.json

jobs:
  staging-contract:
    runs-on: ubuntu-latest
    environment: control-plane-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve short-lived workload identity
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const audience = process.env.JEDEN_STAGING_OIDC_AUDIENCE;
            if (!audience) {
              core.setFailed('ExternalBlocked: JEDEN_STAGING_OIDC_AUDIENCE: workload OIDC audience');
              return;
            }
            const token = await core.getIDToken(audience);
            core.setSecret(token);
            core.exportVariable('JEDEN_STAGING_OIDC_TOKEN', token);

      - name: Create ephemeral report signing identity
        if: steps.oidc.outcome == 'success'
        run: |
          seed="$(openssl rand -hex 32)"
          echo "::add-mask::$seed"
          echo "JEDEN_STAGING_REPORT_SIGNING_KEY_HEX=$seed" >> "$GITHUB_ENV"

      - name: Run exact local contract client path against staging
        if: steps.oidc.outcome == 'success'
        run: cargo test --lib control_plane_staging_e2e_writes_signed_report -- --ignored --nocapture

      - name: Upload signed redacted evidence
        if: always() && hashFiles('control-plane-e2e.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: control-plane-e2e.json
          if-no-files-found: error
          retention-days: 30
